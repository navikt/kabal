# https://sikkerhet.nav.no/docs/verktoy/chainguard-dockerimages/#automagisk-oppdatering-av-tags-p%C3%A5-github
name: "Check for newer image versions"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  digest-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: navikt/digestabot@07cb8ac331b0b06bc0b30a7415587fb63b919608 # v1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          team: klage
